$kind: http-request
order: 2000
method: POST
url: "{{baseUrl}}/api/otp/verifyOtp"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mobileNumber": "9360270984",
      "otp": "614802"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) {
        pm.collectionVariables.set("authToken", res.token);
        pm.collectionVariables.set("userId", res.user._id);
      }
    language: text/javascript
